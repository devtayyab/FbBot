# Copy to config.yaml and fill in. Only `groups` and `destination` are required.

# Facebook groups to watch: the full group URL from your browser
groups:
  - https://www.facebook.com/groups/YOUR_GROUP_ID_OR_NAME

# Where visitors are coming to (used in the reply prompt)
destination: "YOUR_CITY, Country"

# How the comments should sound
persona: "a friendly local who has lived here for years and likes helping visitors"

# "chrome" = your installed Google Chrome with a separate bot profile.
# "chromium" = Playwright's bundled browser.
browser_channel: chrome

scan:
  scrolls: 8               # how far down the "New posts" feed to load each run
  max_post_age_hours: 48   # never reply to posts older than this
  headless: false          # false = you see the browser; Facebook works more reliably

post:
  # false: every draft waits for `python bot.py review`.
  # true:  drafts Claude rates at auto_post_min_confidence or above are posted
  #        without review; the rest still wait for review.
  auto_post: false
  auto_post_min_confidence: high   # high | medium | low
  max_per_run: 5           # comments per hourly run
  max_per_day: 15          # hard daily cap across all runs
  min_delay_seconds: 90    # random pause between two comments
  max_delay_seconds: 240
  comment_box_labels: []   # extra words from your Facebook language's comment box label

llm:
  model: claude-opus-5-5
  effort: low              # low is enough for short replies; medium for trickier questions
  max_reply_words: 40
