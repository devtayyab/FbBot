# Copy to config.yaml and fill in.
#
# You can run this bot in two modes:
# 1. Single Agent (simple default)
# 2. Multi-Agent Swarm (coordinated accounts with like & threaded reply synergy)

# Facebook groups to watch: the full group URL from your browser
groups:
  - https://www.facebook.com/groups/YOUR_GROUP_ID_OR_NAME

# Destination (the place visitors are coming to)
destination: "Lahore, Pakistan"

# Global scan settings
scan:
  scrolls: 8               # how far down the "New posts" feed to load each run
  max_post_age_hours: 48   # never reply to posts older than this
  headless: false          # false = visible browser; true = background

# Shared LLM settings (default for all agents, can be overridden per agent)
llm:
  provider: qwen           # qwen | claude
  model: qwen-plus
  base_url: https://dashscope-intl.aliyuncs.com/compatible-mode/v1
  api_key_env: DASHSCOPE_API_KEY
  extra_body:
    enable_thinking: false
  max_reply_words: 40

# Single-agent default persona & settings (used if 'agents' section below is omitted)
persona: "a friendly local who has lived here for years and likes helping visitors"
browser_channel: chrome
post:
  auto_post: false
  auto_post_min_confidence: high   # high | medium | low
  max_per_run: 5
  max_per_day: 15
  min_delay_seconds: 90
  max_delay_seconds: 240
  comment_box_labels: []

# ----------------------------------------------------------------------------
# Multi-Agent Swarm Configuration (Optional)
# If defined, the bot runs as a coordinated team:
# - Primary agent drafts the top-level response.
# - Secondary agents evaluate whether to LIKE the primary comment or add a
#   THREADED REPLY with complementary tips, after a natural delay.
# ----------------------------------------------------------------------------
agents:
  agent_1:
    name: "Ali (Food & Living)"
    persona: "a friendly local who has lived in Lahore for 10 years and knows street food, old city, and budget stays"
    knowledge_file: "knowledge.md"
    browser_channel: chrome
    post:
      auto_post: false
      auto_post_min_confidence: high
      max_per_run: 5
      max_per_day: 15
      min_delay_seconds: 90
      max_delay_seconds: 240

  agent_2:
    name: "Hamza (Culture & Sights)"
    persona: "a passionate local heritage guide who loves recommending historical architecture, museums, and safe walking tips"
    knowledge_file: "knowledge.md"
    browser_channel: chrome
    post:
      auto_post: false
      auto_post_min_confidence: high
      max_per_run: 5
      max_per_day: 15
      min_delay_seconds: 90
      max_delay_seconds: 240
    collaboration:
      min_delay_after_primary_mins: 15  # wait at least 15m after primary comment before liking/replying
      allow_like: true                  # can like primary agent's comment
      allow_reply: true                 # can post threaded reply to primary comment
